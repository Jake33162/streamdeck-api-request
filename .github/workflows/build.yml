name: Build StreamDeck plugin

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  release-export:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: Prepare directories and files
        run: |
          mkdir release
          move Sources com.github.jake33162.sd-api-request.sdPlugin
          move LICENCE com.github.jake33162.sd-api-request.sdPlugin\LICENCE

      - name: StreamDeck Distribution Tool
        uses: AdamCarballo/streamdeck-distribution-tool@v1
        with:
          input: com.github.jake33162.sd-api-request.sdPlugin
          output: release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.jake33162.sd-api-request.streamDeckPlugin
          path: release\com.github.jake33162.sd-api-request.streamDeckPlugin

      - name: Create draft release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref_name }} - Automated Release
          draft: true
          prerelease: false

      - name: Upload draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release\com.github.jake33162.sd-api-request.streamDeckPlugin
          asset_name: com.github.jake33162.sd-api-request.streamDeckPlugin
          asset_content_type: application/zip

      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
